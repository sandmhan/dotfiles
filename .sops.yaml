# SOPS configuration for secrets management
# Each key group defines which recipients can decrypt files matching the path regex

keys:
  # Admin key (your personal key for managing all secrets)
  # Generate with: age-keygen -o ~/.config/sops/age/keys.txt
  # Get public key: age-keygen -y ~/.config/sops/age/keys.txt
  - &admin_age age1u40h6589nq3razzkuth5h3dysjd2nr50vhgzwpdc0krx0s7wpdhq7r6gcj

  # Host keys (derived from SSH host keys)
  # Get with: ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
  # Or remotely: ssh user@host 'cat /etc/ssh/ssh_host_ed25519_key.pub' | ssh-to-age
  - &gaia_key age1ks8ru7prm58nnh3t24nz7t0jss70lxzerert8n4fe8qwu0xwkg0sqqhmez
  - &nvr_key age1...       # NVR (Frigate) — PLACEHOLDER
  - &matrix_key age1...    # Matrix/Synapse server — PLACEHOLDER
  - &vpn_key age1vvqask3tgv0sv09ehhnwgkr2vqx93h6p59k7r632fapn2wvvr3ls0c07kx
  - &monitor_key age1...   # Monitoring stack (VM or LXC) — PLACEHOLDER
  - &fitness_key age1r6rqt4nfk7uxte7q37a2jvu2yq8jat2tn7n9xpmq9r94v9vzt4pq2negje # Fitness VM (106)

creation_rules:
  # Desktop (gaia) secrets
  - path_regex: secrets/gaia/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *admin_age
      - *gaia_key

  # NVR (Network Video Recorder) secrets
  - path_regex: secrets/nvr/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *admin_age
      - *nvr_key

  # Matrix server secrets
  - path_regex: secrets/matrix/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *admin_age
      - *matrix_key

  # WireGuard VPN server secrets (retained but not deployed — pivoted to Tailscale)
  - path_regex: secrets/wireguard/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *admin_age
      - *vpn_key

  # Tailscale VPN secrets (auth keys for automatic node enrollment)
  - path_regex: secrets/tailscale/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *admin_age
      - *gaia_key
      - *vpn_key

  # Monitoring stack secrets (Grafana, alerting)
  - path_regex: secrets/monitoring/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *admin_age
      - *monitor_key

  # Shared secrets (accessible by multiple hosts)
  - path_regex: secrets/shared/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *admin_age
      - *gaia_key
      - *nvr_key
      - *matrix_key

  # Fitness tracking (wger) secrets
  - path_regex: secrets/fitness/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *admin_age
      - *fitness_key

  # User-specific secrets (personal settings, git config)
  - path_regex: secrets/user/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *admin_age
